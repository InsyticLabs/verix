[project]
name = "verix"
version = "0.1.0"
description = "Local-first AppSec agent for Claude Code and the terminal"
authors = [{name = "Insytic Labs", email = "contact@insytic.com"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.25.1",
    "rich>=15.0.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "mcp>=1.27.0",
]

[project.scripts]
verix = "verix.cli:app"
verix-mcp = "verix.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "pyright>=1.1.409",
]

[project.urls]
Homepage = "https://github.com/InsyticLabs/verix"
Repository = "https://github.com/InsyticLabs/verix"
Issues = "https://github.com/InsyticLabs/verix/issues"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verix"]
include = ["src/verix/**/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
